<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колоритміка — код і ритмічний малюнок</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#eef1f7;color:#18213a;
  font-family:Arial,Helvetica,sans-serif
}
.wrap{max-width:1080px;margin:auto;padding:24px}
.card{
  background:#fff;border-radius:22px;padding:25px;
  box-shadow:0 8px 30px rgba(30,40,70,.10)
}
h1{text-align:center;margin:0 0 5px;font-size:31px}
.subtitle{text-align:center;color:#687386;margin-bottom:20px}
.controls{
  display:flex;gap:10px;align-items:end;
  background:#f7f8fc;padding:14px;border-radius:15px;margin-bottom:16px
}
.control{flex:1}
label{display:block;font-size:13px;font-weight:700;color:#4d586b;margin-bottom:6px}
select,button{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;
  width:100%;height:42px;border:1px solid #d8deea;border-radius:10px;
  background:#fff;color:#18213a;font-size:15px;padding:0 11px
}
button{cursor:pointer;font-weight:700}
.primary{background:#5b4bb7;color:#fff;border-color:#5b4bb7}

.window-title{
  text-align:center;font-size:16px;font-weight:900;
  letter-spacing:.5px;margin:14px 0 8px
}
.code-window{
  border:2px solid #dfe3ec;border-radius:16px;
  background:#fafbfe;padding:18px 20px
}
.code{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px
}
.code-item{
  display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:62px;border-radius:12px;background:#fff;
  border:1px solid #e5e8ef;font-size:24px;font-weight:900
}
.dot{
  width:38px;height:38px;border-radius:50%;
  border:2px solid rgba(0,0,0,.16);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.08)
}
.arrow{color:#8b94a5;font-size:20px}

.rhythm-window{
  min-height:210px;border:2px solid #dfe3ec;border-radius:16px;
  background:#fff;padding:30px 24px;
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:9px
}
.rhythm-dot{
  width:32px;height:32px;border-radius:50%;
  border:2px solid rgba(0,0,0,.16);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.08)
}
.pause{width:14px;height:4px;border-radius:3px;background:#aeb5c2;margin:0 5px}

.info{
  text-align:center;color:#667085;font-size:14px;margin-top:15px;
  background:#f7f8fc;border-radius:12px;padding:12px
}
@media(max-width:700px){
  .controls{flex-wrap:wrap}
  .control{min-width:45%}
  .code{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .wrap{padding:10px}.card{padding:15px}h1{font-size:24px}
  .controls{display:grid;grid-template-columns:1fr}
  .code{grid-template-columns:1fr 1fr;gap:8px}
  .code-item{font-size:19px;min-height:52px}
  .dot{width:30px;height:30px}
  .rhythm-window{padding:25px 10px;gap:6px}
  .rhythm-dot{width:26px;height:26px}
}
@media print{
  body{background:#fff}.wrap{max-width:none;padding:0}.card{box-shadow:none;padding:10px}
  .controls,.savebar,.saved,.info{display:none}
  .code-window{padding:12px}.rhythm-window{min-height:220px}
}
</style>
</head>

<body>
<noscript><div style="margin:15px;padding:15px;border:2px solid #e53935;border-radius:12px;background:#fff5f5;color:#b71c1c;font-weight:bold;text-align:center">Для роботи тренажера потрібно дозволити JavaScript у Safari.</div></noscript>
<div class="wrap">
<div class="card">

<h1>КОЛОРИТМІКА</h1>
<div class="subtitle">Запам'ятай код → відбий ритм → проговори склади</div>

<div class="controls">
  <div class="control">
    <label>Складність складів</label>
    <select id="level">
      <option value="1">1 — прості голосні</option>
      <option value="2" selected>2 — різні приголосні</option>
      <option value="3">3 — контрастні склади</option>
      <option value="4">4 — складні / закриті</option>
    </select>
  </div>
  <div class="control">
    <label>Кількість кружечків</label>
    <select id="count">
      <option value="10">10</option><option value="12">12</option>
      <option value="14">14</option><option value="16" selected>16</option>
      <option value="18">18</option><option value="20">20</option>
    </select>
  </div>
  <div class="control">
    <button class="primary" onclick="newCode()">🔄 Новий код</button>
  </div>
  <div class="control">
    <button onclick="newRhythm()">🎯 Новий ритм</button>
  </div>
</div>

<div class="window-title">КОЛЬОРОВИЙ КОД</div>
<div class="code-window">
  <div id="code" class="code"></div>
</div>

<div class="window-title">РИТМІЧНИЙ МАЛЮНОК</div>
<div id="rhythm" class="rhythm-window"></div>

<div class="savebar">
  <button class="save" onclick="saveComposition()">⭐ Зберегти цю композицію</button>
  <button onclick="showSaved()">📚 Збережені</button>
  <button onclick="clearSaved()">🗑 Очистити збережені</button>
</div>

<div id="saved" class="saved"></div>

<div class="info">
  <b>Завдання:</b> запам'ятай, який склад відповідає кожному кольору.
  Потім відбий ритм і проговори склади, не дивлячись на букви — тільки за кольорами.
</div>

</div>
</div>

<script>
const COLORS=[
  '#2877d4', // синій
  '#f4bd20', // жовтий
  '#31a84a', // зелений
  '#e53935', // червоний
  '#7040b8', // фіолетовий
  '#f28c18', // помаранчевий
  '#35a9df', // блакитний
  '#222222', // чорний
  '#8b5a2b', // коричневий
  '#e85b9c'  // рожевий
];

const LEVELS={
  1:[
    ['па','пу','пе','пі'],['ба','бу','бе','бі'],
    ['ма','му','ме','мі'],['ла','лу','ле','лі'],
    ['на','ну','не','ні'],['та','ту','те','ті']
  ],
  2:[
    ['па','по','пу','пе','пі'],['ба','бо','бу','бе','бі'],
    ['та','то','ту','те','ті'],['да','до','ду','де','ді'],
    ['ла','ло','лу','ле','лі'],['на','но','ну','не','ні'],
    ['ма','мо','му','ме','мі'],['ра','ро','ру','ре','рі']
  ],
  3:[
    ['да','та','да','та'],['ба','па','ба','па'],
    ['ла','ра','ла','ра'],['на','ла','на','ла'],
    ['га','ка','га','ка'],['за','са','за','са'],
    ['жа','ша','жа','ша'],['ча','ща','ча','ща']
  ],
  4:[
    ['бум','бам','бом','бім'],['там','том','тум','тім'],
    ['дам','дом','дум','дім'],['лам','лом','лум','лім'],
    ['нам','ном','нум','нім'],['рам','ром','рум','рім']
  ]
};

let code=[];
let rhythm=[];

function shuffle(a){
  return [...a].sort(()=>Math.random()-0.5);
}
function pick(a){
  return a[Math.floor(Math.random()*a.length)];
}

function newCode(){
  const level=document.getElementById('level').value;
  const pool=LEVELS[level];

  // Завжди рівно 4 кольори і 4 склади.
  const colors=shuffle(COLORS).slice(0,4);
  const source=shuffle(pool);

  // Для кожного кольору беремо окремий склад/складову.
  let syllables=[];
  source.forEach(group=>{
    group.forEach(s=>{
      if(!syllables.includes(s)) syllables.push(s);
    });
  });
  syllables=shuffle(syllables).slice(0,4);

  code=colors.map((color,i)=>({color,syllable:syllables[i]}));

  renderCode();
  newRhythm();
}

function renderCode(){
  document.getElementById('code').innerHTML=code.map(x=>`
    <div class="code-item">
      <span class="dot" style="background:${x.color}"></span>
      <span class="arrow">→</span>
      <span>${x.syllable}</span>
    </div>
  `).join('');
}

function newRhythm(){
  const count=Number(document.getElementById('count').value);
  rhythm=[];

  // Рівномірно випадково розподіляємо 4 кольори,
  // щоб кожен кодовий колір регулярно зустрічався.
  const base=[];
  for(let i=0;i<count;i++) base.push(code[i%4].color);
  rhythm=shuffle(base);

  renderRhythm();
}

function renderRhythm(){
  const box=document.getElementById('rhythm');
  box.innerHTML='';

  rhythm.forEach((color,i)=>{
    const d=document.createElement('span');
    d.className='rhythm-dot';
    d.style.background=color;
    box.appendChild(d);

    // Нерегулярні паузи створюють різні ритмічні групи.
    if(i<rhythm.length-1 && (
      (i+1)%4===0 ||
      (i+1)%7===0 ||
      (i===5 && Math.random()>.5)
    )){
      const p=document.createElement('span');
      p.className='pause';
      box.appendChild(p);
    }
  });
}


function getSaved(){
  try{return JSON.parse(localStorage.getItem('kolorytmyka_saved')||'[]')}
  catch(e){return[]}
}

function saveComposition(){
  if(!code.length || !rhythm.length) return;

  const saved=getSaved();
  const item={
    id:Date.now(),
    date:new Date().toLocaleString('uk-UA'),
    code:code.map(x=>({color:x.color,syllable:x.syllable})),
    rhythm:[...rhythm]
  };

  saved.unshift(item);
  // Щоб список не ставав нескінченним.
  localStorage.setItem('kolorytmyka_saved',JSON.stringify(saved.slice(0,50)));

  const status=document.querySelector('.save');
  status.textContent='✓ Збережено';
  setTimeout(()=>status.textContent='⭐ Зберегти цю композицію',1200);
  showSaved();
}

function loadComposition(id){
  const item=getSaved().find(x=>x.id===id);
  if(!item)return;
  code=item.code;
  rhythm=item.rhythm;
  renderCode();
  renderRhythm();
  document.getElementById('saved').style.display='none';
}

function showSaved(){
  const box=document.getElementById('saved');
  const saved=getSaved();

  if(!saved.length){
    box.style.display='block';
    box.innerHTML='<div class="saved-title">Збережених композицій поки немає.</div>';
    return;
  }

  box.style.display='block';
  box.innerHTML='<div class="saved-title">Збережені композиції</div>';

  saved.forEach((item,index)=>{
    const row=document.createElement('div');
    row.className='saved-item';

    const mini=document.createElement('div');
    mini.className='mini';

    item.rhythm.forEach(c=>{
      const d=document.createElement('span');
      d.className='mini-dot';
      d.style.background=c;
      mini.appendChild(d);
    });

    const text=document.createElement('span');
    text.textContent=`№${saved.length-index} · ${item.date}`;

    const load=document.createElement('button');
    load.textContent='Відкрити';
    load.onclick=()=>loadComposition(item.id);

    const left=document.createElement('div');
    left.style.display='flex';
    left.style.alignItems='center';
    left.style.gap='10px';
    left.appendChild(text);
    left.appendChild(mini);

    row.appendChild(left);
    row.appendChild(load);
    box.appendChild(row);
  });
}

function clearSaved(){
  if(confirm('Видалити всі збережені композиції?')){
    localStorage.removeItem('kolorytmyka_saved');
    document.getElementById('saved').style.display='none';
  }
}

document.getElementById('level').addEventListener('change',newCode);
document.getElementById('count').addEventListener('change',newRhythm);

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', newCode);
}else{
  newCode();
}
</script>
</body>
</html>
