<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#173b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Дихання">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Тренажер випадкових ритмів</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#173b36;
  padding:15px;
}

.box{
  text-align:center;
  width:min(94vw,680px);
}

h1{
  font-size:30px;
  margin:0 0 7px;
}

.sub{
  font-size:18px;
  margin-bottom:18px;
}

.panel{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

.settings{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:88px;
}

label{
  font-size:14px;
}

input,
select{
  font-size:17px;
  padding:9px;
  border:1px solid #bbb;
  border-radius:9px;
  width:78px;
  text-align:center;
  background:white;
  color:#173b36;
}

select{
  width:190px;
}

.circle{
  width:255px;
  height:255px;
  margin:14px auto 17px;
  border-radius:50%;
  background:#d9ebe7;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:transform 1s linear;
}

#phase{
  font-size:32px;
  font-weight:bold;
}

#count{
  font-size:68px;
  margin-top:4px;
}

#rhythm{
  font-size:17px;
  font-weight:bold;
  margin:10px;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}

button{
  font-size:17px;
  padding:12px 18px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  min-height:44px;
}

#start{
  background:#173b36;
  color:#fff;
}

#pause{
  background:#dfe8e5;
  color:#173b36;
}

#stop{
  background:#ddd;
  color:#173b36;
}

#soundTest{
  background:#e8eeee;
  color:#173b36;
}

.volume{
  margin-top:16px;
  font-size:17px;
}

.volume input{
  width:220px;
  vertical-align:middle;
}

#volumeValue{
  display:inline-block;
  width:42px;
  text-align:left;
}

#remaining{
  font-size:17px;
  margin-top:14px;
}

.hint{
  font-size:13px;
  opacity:.7;
  margin-top:11px;
  line-height:1.4;
}

@media(max-width:500px){
  h1{
    font-size:26px;
  }

  .sub{
    font-size:16px;
  }

  .circle{
    width:225px;
    height:225px;
  }

  #phase{
    font-size:29px;
  }

  #count{
    font-size:62px;
  }

  .field{
    min-width:78px;
  }
}
</style>
</head>

<body>

<div class="box">

<h1>Тренажер випадкових ритмів</h1>

<div class="sub">
Вдих → затримка → видих → затримка
</div>

<div class="panel">

<div class="settings">

<div class="field">
<label>Вдих від, с</label>
<input id="imin" type="number" min="1" max="30" value="2">
</div>

<div class="field">
<label>Вдих до, с</label>
<input id="imax" type="number" min="1" max="30" value="5">
</div>

<div class="field">
<label>Затримка після вдиху, с</label>
<input id="hin" type="number" min="1" max="60" value="2">
</div>

<div class="field">
<label>Видих від, с</label>
<input id="emin" type="number" min="1" max="30" value="3">
</div>

<div class="field">
<label>Видих до, с</label>
<input id="emax" type="number" min="1" max="30" value="7">
</div>

<div class="field">
<label>Затримка після видиху, с</label>
<input id="hout" type="number" min="1" max="60" value="2">
</div>

<div class="field">
<label>Тривалість, хв</label>
<input id="minutes" type="number" min="1" max="60" value="5">
</div>

</div>

<div style="margin-top:14px">

<label>Режим випадковості</label>

<br>

<select id="mode">

<option value="each">
Новий ритм кожен цикл
</option>

<option value="one">
Один випадковий ритм
</option>

</select>

</div>

</div>


<div class="circle" id="circle">

<div id="phase">
ГОТОВО
</div>

<div id="count">
—
</div>

</div>


<div id="rhythm">
Ритм: —
</div>


<div class="controls">

<button id="start">
▶ Почати
</button>

<button id="pause">
⏸ Пауза
</button>

<button id="stop">
⏹ Стоп
</button>

<button id="soundTest">
🔊 Тест звуку
</button>

</div>


<div class="volume">

Гучність:

<input
id="volume"
type="range"
min="0"
max="100"
value="100"
step="1"
>

<span id="volumeValue">
100%
</span>

</div>


<div id="remaining">
Встановіть параметри і натисніть «Почати»
</div>


<div class="hint">

Короткий сигнал — початок вдиху або видиху.
<br>
Довший сигнал — початок затримки.

</div>

</div>


<script>

let timer = null;

let totalLeft = 0;

let phaseLeft = 0;

let phase = "inhale";

let paused = false;

let currentInhale = 3;

let currentExhale = 5;

let currentHoldIn = 2;

let currentHoldOut = 2;

let audioCtx = null;


/* =========================
   ЗВУК
========================= */

function audioInit(){

  if(!audioCtx){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return false;
    }

    audioCtx = new AudioContext();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  return true;
}


/*
  Один і той самий сигнал 880 Гц
  для всіх фаз.

  Гучність реально залежить
  від повзунка volume.
*/

function beep(duration = 0.40){

  if(!audioInit()){
    return;
  }

  const now = audioCtx.currentTime;

  const volume =
    Number(
      document.getElementById("volume").value
    ) / 100;


  /*
    Компресор.
    Він робить короткий сигнал
    щільнішим і краще чутним.
  */

  const compressor =
    audioCtx.createDynamicsCompressor();

  compressor.threshold.value = -18;
  compressor.knee.value = 5;
  compressor.ratio.value = 12;
  compressor.attack.value = 0.001;
  compressor.release.value = 0.12;

  compressor.connect(
    audioCtx.destination
  );


  /*
    Основний сигнал
  */

  const osc1 =
    audioCtx.createOscillator();

  const gain1 =
    audioCtx.createGain();

  osc1.type = "square";

  osc1.frequency.value = 880;


  /*
    Гучність основного сигналу.
    0.8 × гучність повзунка.
  */

  const mainLevel =
    0.8 * volume;


  gain1.gain.setValueAtTime(
    0.0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    Math.max(mainLevel,0.0001),
    now + 0.008
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.0001,
    now + duration
  );


  osc1.connect(gain1);
  gain1.connect(compressor);


  /*
    Друга гармоніка.
    Робить звук чіткішим
    на маленькому динаміку iPhone.
  */

  const osc2 =
    audioCtx.createOscillator();

  const gain2 =
    audioCtx.createGain();

  osc2.type = "triangle";

  osc2.frequency.value = 1760;


  const secondLevel =
    0.42 * volume;


  gain2.gain.setValueAtTime(
    0.0001,
    now
  );

  gain2.gain.exponentialRampToValueAtTime(
    Math.max(secondLevel,0.0001),
    now + 0.008
  );

  gain2.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.30
  );


  osc2.connect(gain2);
  gain2.connect(compressor);


  /*
    Короткий високочастотний акцент.
  */

  const osc3 =
    audioCtx.createOscillator();

  const gain3 =
    audioCtx.createGain();

  osc3.type = "sine";

  osc3.frequency.value = 2640;


  const thirdLevel =
    0.22 * volume;


  gain3.gain.setValueAtTime(
    0.0001,
    now
  );

  gain3.gain.exponentialRampToValueAtTime(
    Math.max(thirdLevel,0.0001),
    now + 0.004
  );

  gain3.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.12
  );


  osc3.connect(gain3);
  gain3.connect(compressor);


  /*
    Запуск.
  */

  osc1.start(now);
  osc2.start(now);
  osc3.start(now);

  osc1.stop(now + duration + 0.02);
  osc2.stop(now + 0.32);
  osc3.stop(now + 0.15);

}


/* =========================
   ТЕСТ ЗВУКУ
========================= */

document
  .getElementById("soundTest")
  .addEventListener("click",function(){

    audioInit();

    /*
      Три сигнали поспіль,
      щоб одразу оцінити гучність.
    */

    beep();

    setTimeout(function(){
      beep();
    },500);

    setTimeout(function(){
      beep();
    },1000);

  });


/* =========================
   ПОВЗУНОК ГУЧНОСТІ
========================= */

document
  .getElementById("volume")
  .addEventListener("input",function(){

    document
      .getElementById("volumeValue")
      .textContent =
      this.value + "%";

  });


/* =========================
   ВИПАДКОВІ ЗНАЧЕННЯ
========================= */

function rand(min,max,limit){

  min =
    Math.max(
      1,
      Math.min(
        limit,
        Number(min) || 1
      )
    );

  max =
    Math.max(
      1,
      Math.min(
        limit,
        Number(max) || 1
      )
    );

  if(min > max){

    const temp = min;

    min = max;

    max = temp;

  }

  return Math.floor(
    Math.random() *
    (max - min + 1)
  ) + min;

}


/* =========================
   НОВИЙ РИТМ
========================= */

function newRhythm(){

  currentInhale =
    rand(
      document.getElementById("imin").value,
      document.getElementById("imax").value,
      30
    );

  currentExhale =
    rand(
      document.getElementById("emin").value,
      document.getElementById("emax").value,
      30
    );


  /*
    Затримки фіксовані.
    Їх можна задавати 1–60 секунд.
  */

  currentHoldIn =
    Math.max(
      1,
      Math.min(
        60,
        Number(
          document.getElementById("hin").value
        ) || 2
      )
    );


  currentHoldOut =
    Math.max(
      1,
      Math.min(
        60,
        Number(
          document.getElementById("hout").value
        ) || 2
      )
    );

}


/* =========================
   ПОКАЗ РИТМУ
========================= */

function showRhythm(){

  document.getElementById("rhythm")
    .textContent =
    "Ритм: " +
    currentInhale +
    " с вдих → " +
    currentHoldIn +
    " с затримка → " +
    currentExhale +
    " с видих → " +
    currentHoldOut +
    " с затримка";

}


/* =========================
   ФАЗА
========================= */

function setPhase(
  newPhase,
  seconds,
  sound = true
){

  phase = newPhase;

  phaseLeft = seconds;


  const names = {

    inhale:"ВДИХ",

    holdin:"ЗАТРИМКА",

    exhale:"ВИДИХ",

    holdout:"ЗАТРИМКА"

  };


  document.getElementById("phase")
    .textContent =
    names[newPhase];


  document.getElementById("count")
    .textContent =
    seconds;


  /*
    Вдих — збільшуємо коло.
    Видих — зменшуємо.
    Затримка — середній розмір.
  */

  if(newPhase === "inhale"){

    document.getElementById("circle")
      .style.transform =
      "scale(1.12)";

  }

  else if(newPhase === "exhale"){

    document.getElementById("circle")
      .style.transform =
      "scale(.88)";

  }

  else{

    document.getElementById("circle")
      .style.transform =
      "scale(1)";

  }


  if(sound){

    /*
      Затримка — довший сигнал.
      Вдих і видих — звичайний короткий сигнал.
    */

    if(newPhase === "holdin" || newPhase === "holdout"){
      beep(0.90);
    }
    else{
      beep(0.40);
    }

  }

}


/* =========================
   ЧАС
========================= */

function fmt(seconds){

  return (
    Math.floor(seconds / 60)
    +
    ":"
    +
    String(
      seconds % 60
    ).padStart(2,"0")
  );

}


/* =========================
   ПОЧАТОК
========================= */

function start(){

  audioInit();

  clearInterval(timer);


  if(!paused){

    totalLeft =
      Math.max(
        1,
        Math.min(
          60,
          Number(
            document.getElementById("minutes").value
          ) || 5
        )
      ) * 60;


    newRhythm();

    setPhase(
      "inhale",
      currentInhale,
      false
    );

  }


  paused = false;

  showRhythm();

  beep();


  document.getElementById("remaining")
    .textContent =
    "Залишилось: " +
    fmt(totalLeft);


  timer =
    setInterval(
      tick,
      1000
    );

}


/* =========================
   ТІК
========================= */

function tick(){

  totalLeft--;

  phaseLeft--;


  if(totalLeft <= 0){

    clearInterval(timer);

    timer = null;

    paused = false;


    document.getElementById("phase")
      .textContent =
      "ГОТОВО";


    document.getElementById("count")
      .textContent =
      "✓";


    document.getElementById("circle")
      .style.transform =
      "scale(1)";


    document.getElementById("remaining")
      .textContent =
      "Тренування завершено";


    beep();

    return;

  }


  if(phaseLeft <= 0){

    /*
      ВДИХ → ЗАТРИМКА
    */

    if(phase === "inhale"){

      setPhase(
        "holdin",
        currentHoldIn
      );

    }


    /*
      ЗАТРИМКА → ВИДИХ
    */

    else if(phase === "holdin"){

      setPhase(
        "exhale",
        currentExhale
      );

    }


    /*
      ВИДИХ → ЗАТРИМКА
    */

    else if(phase === "exhale"){

      setPhase(
        "holdout",
        currentHoldOut
      );

    }


    /*
      ЗАТРИМКА → НОВИЙ ЦИКЛ
    */

    else{

      if(
        document.getElementById("mode").value
        ===
        "each"
      ){

        newRhythm();

      }


      showRhythm();


      setPhase(
        "inhale",
        currentInhale
      );

    }

  }

  else{

    document.getElementById("count")
      .textContent =
      phaseLeft;

  }


  document.getElementById("remaining")
    .textContent =
    "Залишилось: " +
    fmt(totalLeft);

}


/* =========================
   ПАУЗА
========================= */

document
  .getElementById("pause")
  .addEventListener(
    "click",
    function(){

      if(timer){

        clearInterval(timer);

        timer = null;

        paused = true;


        document.getElementById("remaining")
          .textContent =
          "Пауза — залишилось: " +
          fmt(totalLeft);

      }

    }
  );


/* =========================
   СТОП
========================= */

document
  .getElementById("stop")
  .addEventListener(
    "click",
    function(){

      clearInterval(timer);

      timer = null;

      paused = false;


      document.getElementById("phase")
        .textContent =
        "ГОТОВО";


      document.getElementById("count")
        .textContent =
        "—";


      document.getElementById("circle")
        .style.transform =
        "scale(1)";


      document.getElementById("rhythm")
        .textContent =
        "Ритм: —";


      document.getElementById("remaining")
        .textContent =
        "Встановіть параметри і натисніть «Почати»";

    }
  );


/* =========================
   СТАРТ
========================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    start
  );


/*
  Початкове значення повзунка.
*/

document
  .getElementById("volumeValue")
  .textContent =
  document.getElementById("volume").value
  + "%";

</script>

</body>
</html>
